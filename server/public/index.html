<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Scripture Presenter Remote</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#10141c"><link rel="stylesheet" href="/remote.css?v=4"></head><body><div class="app"><header class="header"><div class="header-top"><span class="brand">SCRIPTURE PRESENTER</span><span id="connDot" class="conn-dot"></span></div><div id="liveBanner" class="live-banner"><span id="outputLabel" class="live-banner-label">LIVE</span><span id="liveBannerText">Connecting…</span></div></header><div class="remote-actions"><button id="prevBtn">◀ PREV</button><button id="nextBtn">NEXT ▶</button></div><div class="output-controls"><button id="blackBtn" class="output-btn black">BLACK</button><button id="restoreBtn" class="output-btn">RESTORE</button><button id="clearBtn" class="output-btn">CLEAR</button></div><div class="search-bar"><input id="searchInput" placeholder="Reference or phrase…" autocomplete="off"><button id="micBtn" class="mic-btn">🎙</button></div><div id="micStatus" class="mic-status"></div><div class="version-row"><select id="versionSelect"></select><label class="checkbox-label"><input id="multiVersionToggle" type="checkbox"> Search all versions</label></div><div class="remote-selects"><select id="transition"><option value="fade">Fade</option><option value="cut">Cut</option><option value="slide">Slide</option></select><select id="stageMode"><option value="follow">Stage: Follow</option><option value="clock">Stage: Clock</option><option value="notes">Stage: Notes</option></select></div><div class="quick-add-row"><button id="addSongBtn">+ Song</button><button id="addSlideBtn">+ Slide</button></div><div class="theme-row"><button id="themeBlack" class="theme-swatch swatch-black">Black</button><button id="themeBlue" class="theme-swatch swatch-blue">Blue</button><button id="themeWarm" class="theme-swatch swatch-warm">Warm</button></div><div id="resultsMeta" class="results-meta"></div><div id="results" class="results"><div class="empty-state">Search a Scripture to control the presentation.</div></div><button id="scheduleToggle" class="schedule-toggle">SERVICE ORDER · <span id="scheduleCount">0</span></button></div><div id="scheduleSheet" class="schedule-sheet"><div class="schedule-sheet-header"><b>SERVICE ORDER</b><button id="scheduleClose">▼</button></div><div id="scheduleList" class="schedule-list"></div></div><script src="/remote.js?v=4"></script></body></html>
