name: Validate JavaScript and Bible database
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in main.js state.js preload.js server/index.js db/*.js src/control/*.js src/live/*.js src/stage/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Download Bible packs
        run: npm run install-bible-packs
      - name: Build Bible database
        run: npm run build-db
      - name: Verify installed translations and search
        run: |
          node - <<'NODE'
          const search = require('./db/search');
          const versions = search.listVersions();
          console.log(`Installed translations: ${versions.length}`);
          if (versions.length < 10) throw new Error(`Expected at least 10 translations, found ${versions.length}`);
          // Use a pinned, known-complete translation rather than versions[0] —
          // some installed packs (e.g. the Aleppo Codex, Hebrew-only) are
          // Old-Testament-only and sort before "kjv" alphabetically, so
          // picking the "first" version arbitrarily is not a valid full-Bible
          // fixture for these checks.
          const fixtureCode = versions.some(v => v.code === 'kjv') ? 'kjv' : versions[0].code;
          const reference = search.search('John 3:16', fixtureCode);
          if (!reference.results.length) throw new Error(`John 3:16 reference search returned no results (version: ${fixtureCode})`);
          const phrase = search.search('beginning was the Word', fixtureCode);
          if (!phrase.results.length) throw new Error(`Phrase search returned no results (version: ${fixtureCode})`);
          console.log(`Bible search verification passed (version: ${fixtureCode}).`);
          NODE
