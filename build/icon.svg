<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a63"/>
      <stop offset="55%" stop-color="#3d76b8"/>
      <stop offset="100%" stop-color="#9fc9ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ffe9b0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e4bd"/>
      <stop offset="100%" stop-color="#caa25a"/>
    </linearGradient>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="1024" height="1024" rx="184"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <circle cx="512" cy="390" r="300" fill="url(#glow)"/>

    <!-- distant cloud layer -->
    <g fill="#e9f3fc" opacity="0.55">
      <ellipse cx="180" cy="300" rx="120" ry="46"/>
      <ellipse cx="270" cy="270" rx="90" ry="40"/>
      <ellipse cx="840" cy="330" rx="130" ry="48"/>
      <ellipse cx="760" cy="300" rx="95" ry="40"/>
    </g>

    <!-- praying hands, rising up from the cloud bank -->
    <g transform="translate(512,470)">
      <g fill="url(#hands)" stroke="#9c7a3c" stroke-width="3" stroke-linejoin="round">
        <!-- right hand (viewer's right) -->
        <g transform="rotate(15)">
          <path d="M2,235 C -30,235 -54,207 -56,164 L -60,-6 C -61,-36 -46,-54 -28,-54 C -12,-54 0,-40 1,-14 L 4,150 C 4,150 4,58 4,-58 C 4,-90 18,-108 36,-108 C 54,-108 68,-90 68,-60 L 68,138 C 68,88 68,8 68,-22 C 68,-52 82,-70 98,-70 C 114,-70 127,-52 127,-24 L 127,148 C 127,108 127,42 127,16 C 127,-6 138,-22 152,-22 C 166,-22 176,-6 176,16 L 174,172 C 171,220 138,258 92,262 C 50,265 20,254 2,235 Z"/>
        </g>
        <!-- left hand (mirror) -->
        <g transform="scale(-1,1) rotate(15)">
          <path d="M2,235 C -30,235 -54,207 -56,164 L -60,-6 C -61,-36 -46,-54 -28,-54 C -12,-54 0,-40 1,-14 L 4,150 C 4,150 4,58 4,-58 C 4,-90 18,-108 36,-108 C 54,-108 68,-90 68,-60 L 68,138 C 68,88 68,8 68,-22 C 68,-52 82,-70 98,-70 C 114,-70 127,-52 127,-24 L 127,148 C 127,108 127,42 127,16 C 127,-6 138,-22 152,-22 C 166,-22 176,-6 176,16 L 174,172 C 171,220 138,258 92,262 C 50,265 20,254 2,235 Z"/>
        </g>
      </g>
      <!-- center seam where the two palms meet -->
      <line x1="0" y1="-90" x2="0" y2="230" stroke="#9c7a3c" stroke-width="3" opacity="0.6"/>
      <!-- wrists / sleeves -->
      <path d="M-118,210 C -95,255 -42,282 0,282 C 42,282 95,255 118,210 L 104,300 C 74,330 34,342 0,342 C -34,342 -74,330 -104,300 Z" fill="#8a6a2f"/>
    </g>

    <!-- foreground cloud bank the hands rise through -->
    <g fill="#ffffff">
      <ellipse cx="512" cy="770" rx="430" ry="90"/>
      <ellipse cx="300" cy="740" rx="150" ry="70"/>
      <ellipse cx="720" cy="745" rx="160" ry="72"/>
      <ellipse cx="470" cy="700" rx="130" ry="60"/>
      <ellipse cx="600" cy="695" rx="120" ry="58"/>
    </g>
    <g fill="#dfeefb">
      <ellipse cx="380" cy="800" rx="180" ry="55"/>
      <ellipse cx="660" cy="805" rx="190" ry="55"/>
    </g>
  </g>
</svg>
